<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shopping Mission" />
    <meta name="description" content="Plan and run your India shopping trip — offline, private, on your phone." />
    <title>India Shopping Mission</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('india-shopping-mission');
          var dark = false;
          if (raw) {
            var parsed = JSON.parse(raw);
            dark = parsed && parsed.state && parsed.state.settings && parsed.state.settings.dark_mode;
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
